name: Build the Cloudflare Workers
description: >
  Builds gap-app-v2 for Cloudflare Workers using GitHub Environment secrets
  (CF_PUBLIC_ENV and optional SENTRY_AUTH_TOKEN) and bundles both Workers
  (cloudflare-staging.yml, cloudflare-pr-preview.yml,
  cloudflare-production.yml), with no Vercel dependency.

inputs:
  public-env:
    description: secrets.CF_PUBLIC_ENV (dotenv block of NEXT_PUBLIC_* build variables)
    required: true
  sentry-auth-token:
    description: secrets.SENTRY_AUTH_TOKEN (optional; uploads Sentry source maps when set)
    required: false
    default: ''
  environment:
    description: >
      Deployment environment (preview or production), exported as APP_ENV and
      NEXT_PUBLIC_APP_ENV.
    required: false
    default: preview

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        # Wrangler 4 needs Node 22 or newer; the other workflows stay on 20.
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Export the build variables
      # NEXT_PUBLIC_* only, into the step environment. Never a .env at the app
      # root: OpenNext copies it into the Worker bundle.
      shell: bash
      env:
        CF_PUBLIC_ENV: ${{ inputs.public-env }}
        DEPLOYMENT_ENV: ${{ inputs.environment }}
      run: |
        case "$DEPLOYMENT_ENV" in
          preview | production) ;;
          *) echo "::error::environment must be preview or production, not $DEPLOYMENT_ENV"; exit 1 ;;
        esac
        node scripts/cf-env.mjs build
        {
          echo "NEXT_PUBLIC_APP_ENV=$DEPLOYMENT_ENV"
          echo "APP_ENV=$DEPLOYMENT_ENV"
        } >> "$GITHUB_ENV"

    - name: Refuse a .env in the bundle
      shell: bash
      run: |
        # The files OpenNext copies or inlines into the Worker; .env.example is fine.
        for f in .env .env.local .env.production .env.production.local; do
          if [ -e "$f" ]; then
            echo "::error::$f is at the app root; OpenNext would put it in the Worker bundle."
            exit 1
          fi
        done

    - name: Build
      # The Sentry plugin uploads source maps when SENTRY_AUTH_TOKEN is set; it
      # is passed to this step only and never written to a file.
      shell: bash
      env:
        SENTRY_AUTH_TOKEN: ${{ inputs.sentry-auth-token }}
      run: pnpm cf:build

    - name: Bundle and check both Workers
      # Latin-1 and size budgets; deploy these files as they are, never re-bundled.
      shell: bash
      run: pnpm cf:size
