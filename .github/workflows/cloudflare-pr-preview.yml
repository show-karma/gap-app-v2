name: Cloudflare preview of a pull request

# The Cloudflare counterpart of the Vercel preview of each pull request. Every
# PR gets its own pair of Workers, built from the PR head with the Vercel
# "preview" environment, like the Cloudflare staging (cloudflare-staging.yml):
#   gap-app-v2-pr-<n>       routing Worker, https://gap-app-v2-pr-<n>.<account>.workers.dev
#   gap-app-v2-pr-<n>-app   Next server Worker (no public URL)
# Both are deleted when the PR is closed or merged. The URL goes in a PR comment.
#
# One pair per PR, not preview versions of the staging Workers: the routing
# Worker reaches the Next server through a service binding by Worker name, and
# that always lands on the deployed version. A preview version of the routing
# Worker would run the PR's routing over staging's Next server.
#
# All PRs share one R2 bucket, gap-app-v2-pr-opennext-cache (created by the first
# run): each build writes under its own build id, and lifecycle rules expire
# what closed PRs leave behind.
#
# Only PRs from branches of this repository: a fork's PR gets no secrets.
# Runs on PRs into migration-cloudflare while the migration is in progress, where
# the Workers code lives; move it to `main` at the cutover.
#
# By hand (Actions → this workflow → Run workflow): deploy or delete the preview
# of a PR number, from the branch picked there.

on:
  pull_request:
    branches:
      - migration-cloudflare
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      action:
        description: What to do with its preview
        type: choice
        options: [deploy, delete]
        default: deploy

# A newer push replaces a deploy in progress; closing the PR cancels it too.
concurrency:
  group: cloudflare-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PR: ${{ github.event.pull_request.number || inputs.pr }}
  ROUTING_WORKER: gap-app-v2-pr-${{ github.event.pull_request.number || inputs.pr }}
  NEXT_WORKER: gap-app-v2-pr-${{ github.event.pull_request.number || inputs.pr }}-app
  R2_BUCKET: gap-app-v2-pr-opennext-cache
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: 'false'
  GH_TOKEN: ${{ github.token }}
  COMMENT_MARKER: '<!-- cloudflare-pr-preview -->'
  # Right after wrangler creates a Worker, its next API call can still answer
  # "This Worker does not exist" (code 10007); a deploy is retried for that.
  DEPLOY_ATTEMPTS: '3'

jobs:
  deploy:
    name: Deploy the PR preview
    if: >
      github.repository == 'show-karma/gap-app-v2' && (
        (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy') ||
        (github.event_name == 'pull_request' && github.event.action != 'closed' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.actor != 'dependabot[bot]')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV_FILE: .vercel/.env.preview.local
    steps:
      - name: Check the inputs and credentials
        run: |
          if ! [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Not a pull request number: $PR"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set secrets.CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (variable or secret)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The branch as pushed, like the Vercel preview; a dispatch builds the
          # branch it was run from.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build and bundle
        uses: ./.github/actions/cloudflare-build
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}

      - name: Create the shared cache bucket if missing
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET")
          if [ "$status" = "200" ]; then
            echo "$R2_BUCKET exists"
          elif [ "$status" = "404" ]; then
            npx wrangler r2 bucket create "$R2_BUCKET"
            # A PR's cache only matters while it is open; a missing page is rendered again.
            npx wrangler r2 bucket lifecycle add "$R2_BUCKET" expire-incremental-cache incremental-cache/ --expire-days 14 --force
            npx wrangler r2 bucket lifecycle add "$R2_BUCKET" expire-og-images og-images/ --expire-days 8 --force
          else
            echo "::error::Checking the bucket $R2_BUCKET returned HTTP $status."
            exit 1
          fi

      - name: Upload the incremental cache to R2
        run: node scripts/cf-populate-r2.mjs "$R2_BUCKET"

      - name: Create the routing Worker on the first deploy
        # The Next server Worker binds the routing Worker's Durable Objects by
        # script name, so the routing Worker must exist before it. Its first
        # version has no NEXT_SERVER binding; the deploy below adds it.
        env:
          OPEN_NEXT_DEPLOY: 'true'
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$ROUTING_WORKER/settings")
          if [ "$status" = "200" ]; then
            echo "$ROUTING_WORKER exists"
          elif [ "$status" = "404" ]; then
            node scripts/cf-pr-config.mjs "$PR" --without-next-server
            for attempt in $(seq "$DEPLOY_ATTEMPTS"); do
              npx wrangler deploy .open-next/upload/worker.js --config wrangler.pr.jsonc \
                --no-bundle --no-minify --message "first version, without the Next server" && break
              [ "$attempt" = "$DEPLOY_ATTEMPTS" ] && exit 1
              sleep 15
            done
          else
            echo "::error::Checking the Worker $ROUTING_WORKER returned HTTP $status."
            exit 1
          fi

      - name: Write the Workers configs
        run: node scripts/cf-pr-config.mjs "$PR"

      - name: Deploy the Next server Worker
        env:
          OPEN_NEXT_DEPLOY: 'true'
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for attempt in $(seq "$DEPLOY_ATTEMPTS"); do
            npx wrangler deploy .open-next/upload-app/next-server.js \
              --config wrangler.app.pr.jsonc --no-bundle --no-minify \
              --message "PR #$PR at $SHA" && break
            [ "$attempt" = "$DEPLOY_ATTEMPTS" ] && exit 1
            sleep 15
          done

      - name: Deploy the routing Worker
        id: routing
        env:
          OPEN_NEXT_DEPLOY: 'true'
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          for attempt in $(seq "$DEPLOY_ATTEMPTS"); do
            npx wrangler deploy .open-next/upload/worker.js --config wrangler.pr.jsonc \
              --no-bundle --no-minify --message "PR #$PR at $SHA" | tee deploy.log && break
            [ "$attempt" = "$DEPLOY_ATTEMPTS" ] && exit 1
            sleep 15
          done
          url=$(grep -oE "https://$ROUTING_WORKER\.[a-z0-9-]+\.workers\.dev" deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev URL in the deploy output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Copy the missing runtime secrets from Vercel
        # Secrets stay with a Worker across deploys, so only the first deploy (or
        # one after a failed first deploy) copies them. Only the Next server
        # Worker reads them; a preview has no cron, so no CRON_SECRET on routing.
        run: |
          have=$(npx wrangler secret list --name "$NEXT_WORKER" --format json | jq -r '.[].name')
          missing=$(for name in CRON_SECRET SANITY_VIEWER_TOKEN SANITY_WEBHOOK_SECRET SANITY_PREVIEW_SECRET PROJECT_CACHE_REVALIDATION_SECRET FIRECRAWL_API_KEY; do
            grep -qx "$name" <<<"$have" || echo "$name"
          done | paste -sd, -)
          if [ -z "$missing" ]; then
            echo "Every runtime secret is set."
          else
            CF_SECRETS="$missing" node scripts/cf-vercel-env.mjs secrets "$VERCEL_ENV_FILE" -- --config wrangler.app.pr.jsonc
          fi

      - name: Remove the pulled environment
        if: always()
        run: rm -rf .vercel

      - name: Smoke test
        # On a PR's first deploy the routing Worker's new binding to the Next
        # server Worker answers 404 for a few seconds, so each path gets a minute.
        env:
          URL: ${{ steps.routing.outputs.url }}
        run: |
          fail=0
          for path in / /communities /api/geo /sitemap_index.xml /admin/studio; do
            for attempt in 1 2 3 4 5 6; do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$URL$path")
              [ "$status" = "200" ] && break
              sleep 10
            done
            echo "$status $path"
            [ "$status" = "200" ] || fail=1
          done
          exit $fail

      - name: Post the preview URL on the PR
        if: always() && steps.routing.outputs.url != ''
        env:
          URL: ${{ steps.routing.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SMOKE: ${{ job.status }}
        run: |
          body="$COMMENT_MARKER
          **Cloudflare preview:** $URL

          Commit \`${SHA:0:7}\`, Workers \`$ROUTING_WORKER\` and \`$NEXT_WORKER\` (deleted when this PR closes). Smoke test: $SMOKE."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$COMMENT_MARKER\")) | .id" | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  delete:
    name: Delete the PR preview
    if: >
      github.repository == 'show-karma/gap-app-v2' && (
        (github.event_name == 'workflow_dispatch' && inputs.action == 'delete') ||
        (github.event_name == 'pull_request' && github.event.action == 'closed' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the inputs and credentials
        run: |
          if ! [[ "$PR" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Not a pull request number: $PR"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set secrets.CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (variable or secret)."
            exit 1
          fi

      - name: Checkout package.json
        uses: actions/checkout@v5
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # Only npx runs here: no pnpm, so no cache from package.json's packageManager.
          package-manager-cache: false

      - name: Delete both Workers
        # The Next server Worker first: it binds the routing Worker's Durable Objects.
        run: |
          wrangler_version=$(jq -r '.devDependencies.wrangler // .dependencies.wrangler' package.json)
          for worker in "$NEXT_WORKER" "$ROUTING_WORKER"; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/settings")
            if [ "$status" = "404" ]; then
              echo "$worker does not exist"
            elif [ "$status" = "200" ]; then
              npx --yes "wrangler@$wrangler_version" delete "$worker" --force
            else
              echo "::error::Checking the Worker $worker returned HTTP $status."
              exit 1
            fi
          done

      - name: Mark the PR comment
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$COMMENT_MARKER\")) | .id" | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -f body="$COMMENT_MARKER
          **Cloudflare preview:** removed; Workers \`$ROUTING_WORKER\` and \`$NEXT_WORKER\` deleted." > /dev/null
          fi
